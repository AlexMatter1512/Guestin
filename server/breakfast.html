<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakfast · oshost</title><style>body{font:17px system-ui;background:#f4f7f6;color:#172b29;max-width:800px;margin:8vh auto;padding:24px}section{display:flex;gap:16px;flex-wrap:wrap}article{background:white;padding:28px;border-radius:20px;flex:1}strong{display:block;font-size:44px}input,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:10px}#error{color:#a32626}</style><p>oshost / breakfast</p><h1 id="name">Breakfast usage</h1><section><article>Today<strong id="today">—</strong></article><article>This month<strong id="month">—</strong></article><article>Last month<strong id="last">—</strong></article></section><h2>Custom date range</h2><form><input type="date" id="from" aria-label="From" required><input type="date" id="to" aria-label="To" required><button>Check usage</button></form><p id="total"></p><p id="error" role="alert"></p><small id="updated"></small><script>const property=location.pathname.split('/').filter(Boolean).pop();async function load(custom=false){try{const q=custom?'?'+new URLSearchParams({from:document.querySelector('#from').value,to:document.querySelector('#to').value}):'';const r=await fetch('/api/v1/public/breakfast/'+encodeURIComponent(property)+q);const d=await r.json();if(!r.ok)throw Error(d.error);for(const [id,value]of Object.entries({name:d.property,today:d.today,month:d.thisMonth,last:d.lastMonth,total:custom?'Selected range: '+d.total:''}))document.getElementById(id).textContent=value;document.querySelector('#updated').textContent='Updated '+new Date().toLocaleTimeString()+' · '+d.timezone;document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent=e.message}}document.querySelector('form').onsubmit=e=>{e.preventDefault();load(true)};load();setInterval(()=>load(!!document.querySelector('#from').value&&!!document.querySelector('#to').value),30000)</script></html>

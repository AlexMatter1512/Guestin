name: Landing page

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
  workflow_call:
    inputs:
      application_revision:
        description: Main commit that passed application CI
        type: string
        required: true

concurrency:
  group: guestin-landing
  cancel-in-progress: false

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'gh-pages' }}
          path: landing
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Read pinned application revision
        id: source
        working-directory: landing
        env:
          EXPECTED_REVISION: ${{ inputs.application_revision }}
        run: |
          bun -e 'const {revision}=await Bun.file("demo-source.json").json(); if(!/^[0-9a-f]{40}$/.test(revision)) throw Error("Expected a full application commit SHA"); if(process.env.EXPECTED_REVISION && revision !== process.env.EXPECTED_REVISION) throw Error("Demo pin changed since application CI passed"); console.log(`revision=${revision}`)' >> "$GITHUB_OUTPUT"
      - name: Check out application source from this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: application
      - name: Install application dependencies
        working-directory: application
        run: bun install --frozen-lockfile
      - name: Bundle fictional app demos
        working-directory: application
        run: bun scripts/export-landing-demo.ts "$GITHUB_WORKSPACE/landing"
      - name: Install landing dependencies
        working-directory: landing
        run: bun install --frozen-lockfile
      - name: Install browser for demo checks
        working-directory: landing
        run: bunx playwright install --with-deps chromium
      - name: Check types
        working-directory: landing
        run: bunx tsc --noEmit
      - name: Check demos at the domain root
        working-directory: landing
        env:
          LANDING_BASE_PATH: /
        run: |
          bun run build
          bun run test:demo
      - name: Check demos under the repository path
        working-directory: landing
        env:
          LANDING_BASE_PATH: /Guestin/
        run: |
          bun run build
          bun run test:demo
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser-failures
          path: |
            landing/playwright-report
            landing/test-results
          if-no-files-found: ignore
      - name: Read GitHub Pages deployment path
        id: pages
        uses: actions/configure-pages@v5
      - name: Build landing page
        working-directory: landing
        env:
          LANDING_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: guestin-landing
          path: landing/dist
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing/dist

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/gh-pages' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
